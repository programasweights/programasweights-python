name: Runtime wheels

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/runtime-wheels.yml
      - scripts/runtime-wheels/**

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        runtime-version: ["0.3.20", "0.3.21", "0.3.22", "0.3.36"]
        platform:
          - {name: intel, runner: macos-15-intel, arch: x64, wheel-arch: x86_64, deployment-target: "11.0"}
          - {name: arm64, runner: macos-15, arch: arm64, wheel-arch: arm64, deployment-target: "11.0"}
          - {name: arm64-modern, runner: macos-15, arch: arm64, wheel-arch: arm64, deployment-target: "14.0"}
    env:
      CMAKE_ARGS: -C "${{ github.workspace }}/scripts/runtime-wheels/macos-${{ matrix.platform.name }}.cmake"
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment-target }}
      ARCHFLAGS: -arch ${{ matrix.platform.wheel-arch }}
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py38
        with:
          python-version: "3.8"
          architecture: ${{ matrix.platform.arch }}
      - uses: actions/setup-python@v5
        id: py39
        with: {python-version: "3.9", architecture: "${{ matrix.platform.arch }}", update-environment: false}
      - uses: actions/setup-python@v5
        id: py310
        with: {python-version: "3.10", architecture: "${{ matrix.platform.arch }}", update-environment: false}
      - uses: actions/setup-python@v5
        id: py311
        with: {python-version: "3.11", architecture: "${{ matrix.platform.arch }}", update-environment: false}
      - uses: actions/setup-python@v5
        id: py312
        with: {python-version: "3.12", architecture: "${{ matrix.platform.arch }}", update-environment: false}
      - uses: actions/setup-python@v5
        id: py313
        with: {python-version: "3.13", architecture: "${{ matrix.platform.arch }}", update-environment: false}
      - uses: actions/setup-python@v5
        id: py314
        with: {python-version: "3.14", architecture: "${{ matrix.platform.arch }}", update-environment: false}
      - name: Install build tools
        run: python -m pip install -r scripts/runtime-wheels/macos-intel-requirements.txt
      - name: Build pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          script_dir="$GITHUB_WORKSPACE/scripts/runtime-wheels"
          version="${{ matrix.runtime-version }}"
          build_dir=$(mktemp -d)
          trap 'rm -rf -- "$build_dir"' EXIT
          read -r source_spec < "$script_dir/sources/$version.txt"
          curl --fail --location --retry 3 --output "$build_dir/source.tar.gz" "${source_spec%%#sha256=*}"
          printf '%s  %s\n' "${source_spec##*#sha256=}" "$build_dir/source.tar.gz" | shasum -a 256 --check
          tar -xzf "$build_dir/source.tar.gz" -C "$build_dir"
          cd "$build_dir/llama_cpp_python-$version"
          if [[ "$version" == 0.3.21 || "$version" == 0.3.22 || "$version" == 0.3.36 ]]; then
              patch -f -F 0 -V none -p1 < "$script_dir/macos-metal-event.patch"
          fi
          python -m pip wheel --no-cache-dir --no-deps --no-build-isolation \
            . --wheel-dir "$GITHUB_WORKSPACE/wheelhouse"
      - name: Verify installation and offline inference
        shell: python
        run: |
          import pathlib, re, subprocess, tempfile, zipfile
          wheel, = pathlib.Path("wheelhouse").glob("*.whl")
          target = "${{ matrix.platform.deployment-target }}".replace(".", "_")
          assert wheel.name == f"llama_cpp_python-${{ matrix.runtime-version }}-py3-none-macosx_{target}_${{ matrix.platform.wheel-arch }}.whl"
          with tempfile.TemporaryDirectory() as root:
              native_root = pathlib.Path(root) / "native"
              with zipfile.ZipFile(wheel) as archive:
                  archive.extractall(native_root)
              libraries = [
                  p for p in native_root.rglob("*")
                  if p.is_file() and p.suffix in (".dylib", ".so")
              ]
              assert libraries, "Wheel contains no native libraries"
              assert any("libggml-blas" in p.name for p in libraries) == (target == "14_0")
              minimum_target = target.replace("_", ".")
              for library in libraries:
                  architecture = subprocess.check_output(
                      ["lipo", "-archs", str(library)], text=True
                  ).strip()
                  assert architecture == "${{ matrix.platform.wheel-arch }}", (library, architecture)
                  commands = subprocess.check_output(
                      ["otool", "-l", str(library)], text=True
                  )
                  dependencies = re.findall(
                      r"(?m)^\s*cmd LC_(?:LOAD|LOAD_WEAK|REEXPORT|LOAD_UPWARD|LAZY_LOAD)_DYLIB\n"
                      r"\s*cmdsize \d+\n\s*name (.+) \(offset \d+\)$", commands,
                  )
                  assert dependencies, (library, "No library dependencies found")
                  for dependency in dependencies:
                      if dependency.startswith(("/usr/lib/", "/System/Library/")):
                          continue
                      assert dependency.startswith(("@rpath/", "@loader_path/")), (library, dependency)
                      bundled = (library.parent / dependency.split("/", 1)[1]).resolve()
                      assert native_root.resolve() in bundled.parents and bundled.is_file(), (library, dependency)
                  minima = re.findall(r"^\s*minos ([\d.]+)$", commands, re.MULTILINE)
                  assert minima in ([minimum_target], [minimum_target + ".0"]), (library, minima)
                  if target == "11_0":
                      imports = subprocess.check_output(
                          ["nm", "-u", str(library)], text=True
                      )
                      assert not re.search(r"NEWLAPACK|ILP64", imports, re.IGNORECASE), library
              download_cache = str(pathlib.Path(root) / "downloads")
              for python in (
                  "${{ steps.py38.outputs.python-path }}",
                  "${{ steps.py39.outputs.python-path }}",
                  "${{ steps.py310.outputs.python-path }}",
                  "${{ steps.py311.outputs.python-path }}",
                  "${{ steps.py312.outputs.python-path }}",
                  "${{ steps.py313.outputs.python-path }}",
                  "${{ steps.py314.outputs.python-path }}",
              ):
                  subprocess.run([
                      python, "-I", "scripts/runtime-wheels/check_runtime_wheel.py",
                      str(wheel.resolve()), "--download-cache", download_cache,
                  ], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-macos-${{ matrix.runtime-version }}-${{ matrix.platform.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        runtime-version: ["0.3.20", "0.3.21", "0.3.22", "0.3.36"]
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
      CMAKE_ARGS: -C "${{ github.workspace }}/scripts/runtime-wheels/windows.cmake"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py38
        with:
          python-version: "3.8"
          architecture: x64
      - uses: actions/setup-python@v5
        id: py39
        with: {python-version: "3.9", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py310
        with: {python-version: "3.10", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py311
        with: {python-version: "3.11", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py312
        with: {python-version: "3.12", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py313
        with: {python-version: "3.13", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py314
        with: {python-version: "3.14", architecture: x64, update-environment: false}
      - name: Install build tools
        run: python -m pip install -r scripts/runtime-wheels/windows-requirements.txt
      - name: Build pinned upstream source
        run: >-
          python -m pip wheel --no-cache-dir --no-deps --no-build-isolation
          -r scripts/runtime-wheels/sources/${{ matrix.runtime-version }}.txt --wheel-dir wheelhouse
      - name: Audit DLLs and verify offline inference
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          wheel, = pathlib.Path("wheelhouse").glob("*.whl")
          assert wheel.name == "llama_cpp_python-${{ matrix.runtime-version }}-py3-none-win_amd64.whl"
          subprocess.run([
              sys.executable, "-I", "scripts/runtime-wheels/audit_windows_dependencies.py",
              str(wheel.resolve()),
          ], check=True)
          with tempfile.TemporaryDirectory() as download_cache:
              for python in (
                  r"${{ steps.py38.outputs.python-path }}",
                  r"${{ steps.py39.outputs.python-path }}",
                  r"${{ steps.py310.outputs.python-path }}",
                  r"${{ steps.py311.outputs.python-path }}",
                  r"${{ steps.py312.outputs.python-path }}",
                  r"${{ steps.py313.outputs.python-path }}",
                  r"${{ steps.py314.outputs.python-path }}",
              ):
                  subprocess.run([
                      python, "-I", "scripts/runtime-wheels/check_runtime_wheel.py",
                      str(wheel.resolve()), "--download-cache", download_cache,
                  ], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-${{ matrix.runtime-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime-version: ["0.3.20", "0.3.21", "0.3.22", "0.3.36"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py38
        with:
          python-version: "3.8"
          architecture: x64
      - uses: actions/setup-python@v5
        id: py39
        with: {python-version: "3.9", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py310
        with: {python-version: "3.10", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py311
        with: {python-version: "3.11", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py312
        with: {python-version: "3.12", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py313
        with: {python-version: "3.13", architecture: x64, update-environment: false}
      - uses: actions/setup-python@v5
        id: py314
        with: {python-version: "3.14", architecture: x64, update-environment: false}
      - name: Build and repair the Python 3.8 wheel
        run: |
          docker run --rm --volume "$PWD:/io" --workdir /io \
            --env CMAKE_BUILD_PARALLEL_LEVEL=4 \
            quay.io/pypa/manylinux2014_x86_64@sha256:f09bf382e4bcbd5b3cab130f8d0f12dbe474833f95f54182e80e8c0aaa269ff0 \
            bash scripts/runtime-wheels/build-linux-wheel.sh /io/wheelhouse "${{ matrix.runtime-version }}"
      - name: Verify installation and offline inference
        shell: python
        run: |
          import os, pathlib, re, subprocess, tempfile, zipfile
          wheel, = pathlib.Path("wheelhouse").glob("*.whl")
          assert wheel.name == "llama_cpp_python-${{ matrix.runtime-version }}-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          with zipfile.ZipFile(wheel) as archive:
              members = archive.namelist()
          assert len(members) == len(set(members)), "Duplicate wheel archive members"
          variants = (
              "x64 sse42 sandybridge ivybridge piledriver haswell skylakex "
              "cannonlake cascadelake icelake cooperlake zen4 alderlake sapphirerapids"
          ).split()
          expected = {"llama_cpp/lib/libggml-cpu-" + name + ".so" for name in variants}
          modules = {name for name in members
                     if pathlib.PurePosixPath(name).name.startswith("libggml-cpu-")}
          assert modules == expected, {"missing": sorted(expected - modules),
                                       "unexpected": sorted(modules - expected)}
          for name in ("libggml.so", "libggml-base.so", "libllama.so", "libmtmd.so"):
              assert "llama_cpp/lib/" + name in members, "Missing runtime library: " + name
          with tempfile.TemporaryDirectory() as root:
              native_root = pathlib.Path(root) / "native"
              readelf_env = dict(os.environ, LC_ALL="C")
              with zipfile.ZipFile(wheel) as archive:
                  libraries = [name for name in archive.namelist() if re.search(r"\.so(?:\.\d+)*$", name)]
                  assert libraries, "Wheel contains no native libraries"
                  for name in libraries:
                      library = archive.extract(name, native_root)
                      with open(library, "rb") as binary:
                          header = binary.read(20)
                      assert header[:6] == b"\x7fELF\x02\x01" and int.from_bytes(header[18:20], "little") == 62, name
                      dynamic = subprocess.check_output(["readelf", "-dW", library], text=True, env=readelf_env)
                      rpaths = re.findall(r"\((?:RPATH|RUNPATH)\).*?\[(.*?)\]", dynamic)
                      assert all(re.fullmatch(r"\$(?:ORIGIN|\{ORIGIN\})(?:/.*)?", path)
                                 for entry in rpaths for path in entry.split(":")), (name, rpaths)
                      versions = subprocess.check_output(["readelf", "--version-info", "-W", library], text=True, env=readelf_env)
                      needs = re.search(r"(?ms)^Version needs section.*?(?=^Version |\Z)", versions)
                      for namespace, maximum in (("GLIBC", (2, 17)), ("GLIBCXX", (3, 4, 19)), ("CXXABI", (1, 3, 7))):
                          required = re.findall(r"\bName: " + namespace + r"_([^\s]+)", needs.group() if needs else "")
                          assert all(re.fullmatch(r"\d+(?:\.\d+)+", version) and
                                     tuple(map(int, version.split("."))) <= maximum
                                     for version in required), (name, namespace, required)
              for python in (
                  "${{ steps.py38.outputs.python-path }}",
                  "${{ steps.py39.outputs.python-path }}",
                  "${{ steps.py310.outputs.python-path }}",
                  "${{ steps.py311.outputs.python-path }}",
                  "${{ steps.py312.outputs.python-path }}",
                  "${{ steps.py313.outputs.python-path }}",
                  "${{ steps.py314.outputs.python-path }}",
              ):
                  subprocess.run([
                      python, "-I", "scripts/runtime-wheels/check_runtime_wheel.py",
                      str(wheel.resolve()), "--check-x64",
                      "--download-cache", str(pathlib.Path(root) / "downloads"),
                  ], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-linux-${{ matrix.runtime-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
